version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: product_importer_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # expose postgres on a different host port to avoid conflicts
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: product_importer_redis
    # expose redis on a different host port
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: product_importer_web
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    # Run Django with Gunicorn (4 workers, 2 threads each = 8 concurrent requests)
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8050 --workers 4 --threads 2 --timeout 300 --access-logfile - --error-logfile - --log-level info
    ports:
      - "8050:8050"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker_1:
    build: .
    container_name: product_importer_celery_1
    command: celery -A config worker --loglevel=info --concurrency=2 -n worker1@%h
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker_2:
    build: .
    container_name: product_importer_celery_2
    command: celery -A config worker --loglevel=info --concurrency=2 -n worker2@%h
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker_3:
    build: .
    container_name: product_importer_celery_3
    command: celery -A config worker --loglevel=info --concurrency=2 -n worker3@%h
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker_4:
    build: .
    container_name: product_importer_celery_4
    command: celery -A config worker --loglevel=info --concurrency=2 -n worker4@%h
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: product_importer_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  flower:
    build: .
    container_name: product_importer_flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker_1
      - celery_worker_2
      - celery_worker_3
      - celery_worker_4
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
