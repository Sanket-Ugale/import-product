# Nginx configuration for Product Importer
# This file should be placed in /etc/nginx/sites-available/
# and symlinked to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name localhost;  # Change to your domain name if needed

    # Increase max upload size to 100MB (matches Django settings)
    client_max_body_size 100M;

    # Increase timeouts for large file uploads
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Proxy to Django application
    location / {
        proxy_pass http://localhost:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important for file uploads
        proxy_request_buffering off;
    }

    # Static files (if served through nginx)
    location /static/ {
        alias /root/fulfil/staticfiles/;
        expires 30d;
    }

    # Media files (uploaded files)
    location /media/ {
        alias /root/fulfil/media/;
        expires 30d;
    }

    # Logs
    access_log /var/log/nginx/product_importer_access.log;
    error_log /var/log/nginx/product_importer_error.log;
}
